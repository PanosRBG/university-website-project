<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up</title>
        <link rel="stylesheet" href="styles/menu.css"/>
        <link rel="stylesheet" href="styles/sign-up.css"/>
    </head>

    <body>
        
        <div class="container">
            
            <div class="menu">
                <nav>
                    <a href="index.html">Home</a><br>
                    <a href="requirements.html">Requirements</a><br>
                    <a href="application.html">Application</a>
                    <p>Log-in/Sign-up</p>
                    <a href="more.html">About</a>
                </nav>
            </div>
            
            <div class="form">
                <h1>Sign-up</h1>
                
                <form>
                    <p>
                        <label for="first-name">First Name</label><br>
                        <input type="text" id="first-name">
                    </p>

                    <p>
                        <label for="last-name">Last Name</label><br>
                        <input type="text" id="last-name">
                    </p>

                    <p>
                        <label for="_username">Username</label><br>
                        <input type="text" id="username">
                    </p>

                    <p>
                        <label for="_email">Email</label><br>
                        <input type="email" id="_email">
                    </p>

                    <p>
                        <label for="_phonenumber">Phone Number</label><br>
                        <input type="number" id="_phonenumber">
                    </p>

                    <p>
                        <label for="_university">University</label><br>
                        <input type="text" id="_university">
                    </p>

                    <p>
                        <label for="_am">AM</label><br>
                        <input type="number" id="_am">
                    </p>

                    <p>
                        <label for="_password">Password</label><br>
                        <input type="password" id="_password">
                    </p>

                    <p>
                        <label for="_confirm_password">Confirm Password</label><br>
                        <input type="password" id="_confirm_password">
                    </p>

                    <p>
                        <label for="_birth_date">Date of Birth</label><br>
                        <input type="date" id="_birth_date">
                    </p>

                    <p>
                        <label for="_male">Male</label>
                        <input type="radio" id="_male" name="_sex" value="male">
                        <label for="_female">Female</label>
                        <input type="radio" id="_female" name="_sex" value="female">
                    </p>
                    
                    <input type="submit" value="sign-up" onclick="alert('You are now signed up! (again, not really)')">
                </form>
                
                <p>By signing up, you agree to our <a href="terms.html">Terms and Conditions</a>.</p>
                    
                <p>Already have an account? <a href="log-in.html">Log-in here.</a></p>
                
            </div>

        </div>

        <footer>
            <p>
                Contact: placeholder@email.com |
                <a href="uhttps://erasmus-plus.ec.europa.eu/document/higher-education-institutions-holding-an-eche-2021-2027">Partners</a> |
                <a href="more.html">About</a>
            </p>
            <p>&copy; 1791 Erasmus Program. All rights reserved. (not really)</p>
        </footer>

    </body>

</html>
